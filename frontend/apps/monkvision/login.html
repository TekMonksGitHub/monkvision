<style>
body {
	margin: 0; padding: 0;
	min-height: 600px;
}

body::after {
  content: "";
  position: absolute;
  z-index: -1;   
}

.lgbox {
	position: absolute;
	text-align: center;
	background-color: #ffffff;
	border-radius: 2em;
	cursor: default;
	transition: all 0.3s ease-out;
	width: 24em;
	min-height: 6.5em;
	box-sizing: border-box;
	padding: 0.8em 1.2em;
}

.lgbox:hover {
	transform: scale(1.02);
	cursor: pointer;
}

.lgbox .tkmlogo {
	height: 4em;
	width: auto;
	max-width: 100%;
	display: block;
	margin: 0 auto;
}

.lgbox span {
	width: 100%;
	display: block;
	margin-top: 0.5em;
	text-align: center;
	font-size: 16px;
	font-weight: 600;
	color: #1a1a1a;
}

div.lgbox > span {white-space: normal;}

.langbox {
	position: absolute;
	text-align: center;
	cursor: default;
}

.langsel {
	cursor: pointer;
	font-size: 11px;
}

a:link, a:visited {text-decoration:none;}    
a:hover, a:active {text-decoration:underline;} 

.advtextbox{
	position: absolute;
	text-align: center;
}

.advtextbox > h1 {white-space: normal;}

.advtextbox > h2 {white-space: normal;}

.advtextbox > p {
	position: relative;
	cursor: default;
}

img.logo {position: absolute;}

span#signin {
	position: absolute;
	cursor: default;
}

span#signin > span {padding-right: 30px;}

span#signin > span:last-child {white-space: normal;}

span#signin > span > a {text-decoration: none;}
</style>

<!doctype html>
<html>
<head>
	<meta charset="UTF-8">

	<link href="./img/favicon.png" rel="icon" type="image/x-icon">
	
	<title>{{i18n.title}}</title>
	
	<script type="module">
	import {language} from "./js/language.mjs"; window.language=language;
	import {tkmlogin} from "{{{APP_CONSTANTS.TKMLOGIN_LIB}}}";
	window.monkvisionSSOLogin = () => tkmlogin.login("{{{i18n.title}}}",
		"{{#_org_monkshu_makeLink}}{{{APP_CONSTANTS.LOGINRESULT_HTML}}}{{/_org_monkshu_makeLink}}",
		"{{{APP_CONSTANTS.API_LOGIN}}}?op=getotk", undefined, "{{{APP_CONSTANTS.TKMLOGINAPP_URL}}}");
	</script>
	{{{css}}}
</head>

<body>
<img class="logo" src="{{{htmlData.logo}}}" onclick="window.open('{{{htmlData.aboutLink}}}', '_blank')"></img>

<div class="advtextbox">
	<h1>{{i18n.logintagline}}</h1>
	<h2>{{i18n.loginsubtag}}</h2>
	<p onclick="window.open('{{{htmlData.aboutLink}}}', '_blank')">{{i18n.learn}}</p>
</div>

<div class="lgbox" id="sso-login" onclick="window.monkvisionSSOLogin()">
	<img class="tkmlogo" src="{{{i18n.tkmLogo}}}">
	<span>{{i18n.loginMsg}}</span>
</div>

<div class="langbox">
	<span class="langsel" onclick="language.changeLanguage('en')">English</span>&nbsp;&nbsp;
	<span class="langsel" onclick="language.changeLanguage('hi')">हिंदी</span>&nbsp;&nbsp;
	<span class="langsel" onclick="language.changeLanguage('ja')">日本語</span>
	<span class="langsel" onclick="language.changeLanguage('th')">&nbsp;ภาษาไทย</span>
	<span class="langsel" onclick="language.changeLanguage('zh')">中文</span>
</div>	
</body>

</html>
